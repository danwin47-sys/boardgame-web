<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞昱桌遊社 - Web 版管理系統</title>
    <!-- 引入 CSS 樣式表 -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/bgg-style.css">
    <link rel="stylesheet" href="/css/bgg-recommendations.css">
    <link rel="stylesheet" href="/css/search.css">
    <link rel="stylesheet" href="/css/lazy-load.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/loading.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>

<body>
    <!-- 標題和統計資訊容器 -->
    <div class="header-stats-wrapper">
        <h1>瑞昱桌遊社 - 桌遊管理系統</h1>

        <!-- 統計資訊 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">總數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="availableCount">0</div>
                <div class="stat-label">在庫</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="borrowedCount">0</div>
                <div class="stat-label">借出</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unstockedCount">0</div>
                <div class="stat-label">未入庫</div>
            </div>
        </div>
    </div>

    <!-- 資訊列 -->
    <div class="info-bar">
        <span id="resultCount">顯示 0 / 總共 0 款桌遊</span>
        <span id="lastUpdateTime">最後更新：--:--</span>
    </div>

    <!-- 搜尋和篩選 -->
    <div class="search-filter-container">
        <div class="table-search-wrapper">
            <input type="text" id="searchBox" class="search" placeholder="🔍 搜尋桌遊名稱、借閱人、工號...">
            <div id="tableSearchHistory" class="table-search-history"></div>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="借出">借出</button>
            <button class="player-btn" data-players="1">1人</button>
            <button class="player-btn" data-players="2">2人</button>
            <button class="player-btn" data-players="3">3人</button>
            <button class="player-btn" data-players="4">4人</button>
            <button class="player-btn" data-players="5">5人</button>
            <button class="player-btn" data-players="6">6人</button>
            <button class="player-btn" data-players="7">7人</button>
            <button class="player-btn" data-players="8">8人</button>
            <button class="player-btn" data-players="9">9人</button>
            <button class="player-btn" data-players="10+">10人以上</button>
            <button class="clear-btn" id="clearFiltersBtn">清除篩選</button>
        </div>
    </div>

    <!-- BGG BoardGameGeek 搜尋功能 -->
    <div class="bgg-section">
        <div class="bgg-header">
            <h2>功能清單</h2>
            <a href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer" class="bgg-attribution">
                <img src="/images/powered-by-bgg.png" alt="Powered by BoardGameGeek" class="bgg-logo">
            </a>
        </div>

        <div class="bgg-search-container">
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="bggSearchBtn" class="btn primary large"
                    style="flex: 1; min-width: 200px; text-align: center;">🔍 BGG桌遊搜尋</button>
                <button id="bggRecommendationsBtn" class="btn primary large" onclick="toggleRecommendations('bgg')"
                    style="flex: 1; min-width: 200px; white-space: nowrap; text-align: center;">
                    🔥 BGG 熱門桌遊
                </button>
                <button id="clubRecommendationsBtn" class="btn primary large" onclick="toggleRecommendations('club')"
                    style="flex: 1; min-width: 200px; white-space: nowrap; text-align: center; background-color: #38a169;">
                    🏆 桌遊社熱門桌遊
                </button>
                <button class="btn primary large" onclick="window.location.href='/gallery.html'"
                    style="flex: 1; min-width: 200px; white-space: nowrap; text-align: center; background-color: #667eea;">
                    🖼️ 桌遊展示牆
                </button>
                <button class="btn primary large" onclick="window.location.href='/admin.html'"
                    style="flex: 1; min-width: 200px; white-space: nowrap; text-align: center; background-color: #e53e3e;">
                    ⚙️ 管理者系統
                </button>
            </div>
        </div>

        <!-- BGG 熱門桌遊推薦內容 -->
        <div class="bgg-rec-content" id="bggRecContent" style="display: none;">
            <!-- 分類標籤 -->
            <div class="bgg-category-tabs">
                <button class="bgg-tab" onclick="loadBGGCategory('party')">🎉 派對桌遊</button>
                <button class="bgg-tab" onclick="loadBGGCategory('strategy')">🧠 策略桌遊</button>
                <button class="bgg-tab" onclick="loadBGGCategory('family')">👨‍👩‍👧 家庭桌遊</button>
                <button class="bgg-tab" onclick="loadBGGCategory('children')">🧸 兒童桌遊</button>
            </div>

            <!-- 遊戲列表 -->
            <div id="bggCategoryList" class="bgg-category-list"></div>
        </div>

        <!-- BGG 使用說明 -->
        <p class="bgg-notice">
            本功能使用 BoardGameGeek 數據僅供非商業用途。數據來源：<a href="https://boardgamegeek.com" target="_blank"
                rel="noopener">BoardGameGeek</a>
        </p>
    </div>

    <table id="gameTable">
        <thead>
            <tr>
                <th data-col="name">桌遊名稱</th>
                <th>類型</th>
                <th data-col="status">狀態</th>
                <th data-col="borrower">借閱人 / 目前持有者</th>
                <th data-col="borrower_id">工號</th>
                <th data-col="custodian">保管人</th>
                <th data-col="mdate">修改日期</th>
                <th data-col="location">位置</th>
                <th data-col="diff">難度</th>
                <th data-col="players">遊玩人數</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>


    <!-- Toast 通知容器 -->
    <div id="toast" class="toast"></div>

    <!-- 引入 JavaScript 邏輯 -->
    <script src="/js/loading.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/lazy-load.js"></script>
    <script src="/js/gestures.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/bgg.js"></script>
</body>

</html>
