<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效能監控 - Boardgame-Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .card-title {
            font-size: 1.5em;
            color: #333;
            font-weight: 600;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #333;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-connected {
            background: #10b981;
            color: white;
        }

        .status-disconnected {
            background: #ef4444;
            color: white;
        }

        .hit-rate {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .refresh-info {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 50px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 效能監控儀表板</h1>
        
        <div id="loading" class="loading">載入中...</div>
        <div id="dashboard" class="dashboard" style="display: none;"></div>
        <div class="refresh-info">
            <p>⏱️ 自動刷新：每 5 秒</p>
            <p id="last-update"></p>
        </div>
    </div>

    <script>
        let refreshInterval;

        async function fetchMonitoringData() {
            try {
                const [redisRes, cacheRes, systemRes, healthRes] = await Promise.all([
                    fetch('/api/monitoring/redis-stats'),
                    fetch('/api/monitoring/cache-stats'),
                    fetch('/api/monitoring/system-info'),
                    fetch('/api/monitoring/health')
                ]);

                const redis = await redisRes.json();
                const cache = await cacheRes.json();
                const system = await systemRes.json();
                const health = await healthRes.json();

                return { redis, cache, system, health };
            } catch (error) {
                console.error('獲取監控數據失敗:', error);
                return null;
            }
        }

        function renderDashboard(data) {
            const dashboard = document.getElementById('dashboard');
            const loading = document.getElementById('loading');
            
            if (!data) {
                dashboard.innerHTML = '<div class="error">無法獲取監控數據</div>';
                loading.style.display = 'none';
                dashboard.style.display = 'block';
                return;
            }

            const { redis, cache, system, health } = data;

            let html = '';

            // Redis 統計卡片
            html += `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">🔴</div>
                        <div class="card-title">Redis 統計</div>
                    </div>
                    ${redis.success ? `
                        <div class="stat-row">
                            <span class="stat-label">狀態</span>
                            <span class="status-badge status-connected">已連線</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">版本</span>
                            <span class="stat-value">${redis.version}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">運行時間</span>
                            <span class="stat-value">${Math.floor(redis.uptime_seconds / 3600)} 小時</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">已用記憶體</span>
                            <span class="stat-value">${redis.used_memory}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">總鍵數</span>
                            <span class="stat-value">${redis.total_keys}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">連線客戶端</span>
                            <span class="stat-value">${redis.connected_clients}</span>
                        </div>
                    ` : `
                        <div class="stat-row">
                            <span class="stat-label">狀態</span>
                            <span class="status-badge status-disconnected">未連線</span>
                        </div>
                        <div class="error">${redis.error || '使用記憶體快取'}</div>
                    `}
                </div>
            `;

            // 快取命中率卡片
            if (cache.success && cache.redis_available) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🎯</div>
                            <div class="card-title">快取命中率</div>
                        </div>
                        <div class="hit-rate">${cache.hit_rate}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${cache.hit_rate}%">
                                ${cache.hit_rate}%
                            </div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">命中次數</span>
                            <span class="stat-value">${cache.keyspace_hits.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">未命中次數</span>
                            <span class="stat-value">${cache.keyspace_misses.toLocaleString()}</span>
                        </div>
                    </div>
                `;
            }

            // 系統資訊卡片
            if (system.success) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">💻</div>
                            <div class="card-title">系統資訊</div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">CPU 使用率</span>
                            <span class="stat-value">${system.cpu_percent}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${system.cpu_percent}%">
                                ${system.cpu_percent}%
                            </div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">記憶體使用率</span>
                            <span class="stat-value">${system.memory.percent}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${system.memory.percent}%">
                                ${system.memory.percent}%
                            </div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">可用記憶體</span>
                            <span class="stat-value">${system.memory.available}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">磁碟使用率</span>
                            <span class="stat-value">${system.disk.percent}%</span>
                        </div>
                    </div>
                `;
            }

            // 健康檢查卡片
            if (health.success) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">❤️</div>
                            <div class="card-title">健康檢查</div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">整體狀態</span>
                            <span class="status-badge status-connected">${health.status}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Redis</span>
                            <span class="stat-value">${health.services.redis}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">應用程式</span>
                            <span class="stat-value">${health.services.application}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">更新時間</span>
                            <span class="stat-value">${new Date(health.timestamp).toLocaleTimeString('zh-TW')}</span>
                        </div>
                    </div>
                `;
            }

            dashboard.innerHTML = html;
            loading.style.display = 'none';
            dashboard.style.display = 'grid';

            // 更新最後更新時間
            document.getElementById('last-update').textContent = 
                `最後更新：${new Date().toLocaleTimeString('zh-TW')}`;
        }

        async function updateDashboard() {
            const data = await fetchMonitoringData();
            renderDashboard(data);
        }

        // 初始載入
        updateDashboard();

        // 每 5 秒自動刷新
        refreshInterval = setInterval(updateDashboard, 5000);

        // 頁面隱藏時停止刷新，顯示時恢復
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
            } else {
                updateDashboard();
                refreshInterval = setInterval(updateDashboard, 5000);
            }
        });
    </script>
</body>
</html>
