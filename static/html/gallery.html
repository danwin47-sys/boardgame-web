<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌遊展示牆 - 瑞昱桌遊社</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/gallery.css">
</head>

<body>
    <header class="gallery-header">
        <div class="header-content">
            <h1>🖼️ 桌遊展示牆 <span id="totalGamesCount" class="game-count"></span></h1>
            <a href="/" class="back-link">← 返回管理系統</a>
        </div>
        <span id="filteredGamesCount" class="filtered-count"></span>
    </header>

    <section class="filters-section">
        <div class="filter-container">
            <div class="filter-tags">
                <button class="filter-tag" data-filter-type="players" data-value="1"
                    onclick="toggleFilter('players', 1)">1人</button>
                <button class="filter-tag" data-filter-type="players" data-value="2"
                    onclick="toggleFilter('players', 2)">2人</button>
                <button class="filter-tag" data-filter-type="players" data-value="3"
                    onclick="toggleFilter('players', 3)">3人</button>
                <button class="filter-tag" data-filter-type="players" data-value="4"
                    onclick="toggleFilter('players', 4)">4人</button>
                <button class="filter-tag" data-filter-type="players" data-value="5"
                    onclick="toggleFilter('players', 5)">5人</button>
                <button class="filter-tag" data-filter-type="players" data-value="6"
                    onclick="toggleFilter('players', 6)">6人</button>
                <button class="filter-tag" data-filter-type="players" data-value="7"
                    onclick="toggleFilter('players', 7)">7人</button>
                <button class="filter-tag" data-filter-type="players" data-value="8"
                    onclick="toggleFilter('players', 8)">8人</button>
                <button class="filter-tag" data-filter-type="players" data-value="9"
                    onclick="toggleFilter('players', 9)">9人</button>
                <button class="filter-tag" data-filter-type="players" data-value="10+"
                    onclick="toggleFilter('players', '10+')">10人以上</button>
                <button class="filter-tag" data-filter-type="location" data-value="1廠"
                    onclick="toggleFilter('location', '1廠')">1廠</button>
                <button class="filter-tag" data-filter-type="location" data-value="2廠"
                    onclick="toggleFilter('location', '2廠')">2廠</button>
                <button class="filter-tag" data-filter-type="location" data-value="3廠"
                    onclick="toggleFilter('location', '3廠')">3廠</button>
                <button class="filter-tag active" data-filter-type="status" data-value="all"
                    onclick="toggleStatusFilter('all')">全部</button>
                <button class="filter-tag" data-filter-type="status" data-value="在庫"
                    onclick="toggleStatusFilter('在庫')">在庫</button>
                <button class="filter-tag" data-filter-type="status" data-value="借出"
                    onclick="toggleStatusFilter('借出')">借出</button>
            </div>
        </div>
    </section>

    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading-message">載入中...</div>
        </div>
    </main>

    <div class="modal" id="gameModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="/js/gallery.js"></script>
</body>

</html>
