<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 卡片翻轉效果 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            text-align: center;
            font-size: 2.5rem;
        }

        .demo-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        /* 3D 卡片效果 */
        .game-card {
            perspective: 1000px;
            width: 100%;
            max-width: 300px;
            height: 420px;
            margin: 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .game-card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
        }

        /* 卡片正面 */
        .card-image {
            width: 100%;
            height: 70%;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.7) 70%, transparent 100%);
        }

        .card-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .favorite-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favorite-btn:hover {
            background: #ff6b6b;
            color: white;
            transform: scale(1.1);
        }

        .status-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #51cf66;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 卡片背面 */
        .card-back h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .game-info {
            width: 100%;
            text-align: left;
        }

        .game-info p {
            margin: 12px 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .detail-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        /* 提示文字 */
        .hint {
            color: white;
            text-align: center;
            margin-top: 30px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 響應式 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .demo-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <h1>🎴 3D 卡片翻轉效果 Demo</h1>

    <div class="demo-container">
        <!-- 卡片 1 -->
        <div class="game-card">
            <div class="card-inner">
                <!-- 正面 -->
                <div class="card-front">
                    <div class="card-image">
                        🎲
                        <span class="status-badge">在庫</span>
                        <button class="favorite-btn">♥</button>
                        <div class="card-overlay">
                            <h3 class="card-title">卡坦島</h3>
                        </div>
                    </div>
                </div>

                <!-- 背面 -->
                <div class="card-back">
                    <h3>卡坦島</h3>
                    <div class="game-info">
                        <p>👥 3-4 人</p>
                        <p>⏱️ 60-90 分鐘</p>
                        <p>⭐ 8.5/10</p>
                        <p>📍 1廠</p>
                    </div>
                    <button class="detail-btn">查看詳情</button>
                </div>
            </div>
        </div>

        <!-- 卡片 2 -->
        <div class="game-card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="card-image">
                        🃏
                        <span class="status-badge">在庫</span>
                        <button class="favorite-btn">♥</button>
                        <div class="card-overlay">
                            <h3 class="card-title">富饒之城</h3>
                        </div>
                    </div>
                </div>

                <div class="card-back">
                    <h3>富饒之城</h3>
                    <div class="game-info">
                        <p>👥 2-8 人</p>
                        <p>⏱️ 30-60 分鐘</p>
                        <p>⭐ 8.0/10</p>
                        <p>📍 2廠</p>
                    </div>
                    <button class="detail-btn">查看詳情</button>
                </div>
            </div>
        </div>

        <!-- 卡片 3 -->
        <div class="game-card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="card-image">
                        🏰
                        <span class="status-badge">在庫</span>
                        <button class="favorite-btn">♥</button>
                        <div class="card-overlay">
                            <h3 class="card-title">璀璨寶石</h3>
                        </div>
                    </div>
                </div>

                <div class="card-back">
                    <h3>璀璨寶石</h3>
                    <div class="game-info">
                        <p>👥 2-4 人</p>
                        <p>⏱️ 30 分鐘</p>
                        <p>⭐ 7.8/10</p>
                        <p>📍 3廠</p>
                    </div>
                    <button class="detail-btn">查看詳情</button>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">💡 將滑鼠移到卡片上查看翻轉效果</p>

    <script>
        // 收藏功能示範
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                btn.style.background = btn.style.background === 'rgb(255, 107, 107)' ? 'rgba(255, 255, 255, 0.9)' : '#ff6b6b';
                btn.style.color = btn.style.background === 'rgb(255, 107, 107)' ? 'white' : '';
            });
        });

        // 詳情按鈕示範
        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                alert('這裡會開啟遊戲詳情頁面！');
            });
        });
    </script>
</body>

</html>
