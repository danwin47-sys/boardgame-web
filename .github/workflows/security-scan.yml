name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # 每週日午夜
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit
      
      - name: Run Safety check
        run: |
          echo "## 🔒 Safety 安全性掃描" >> $GITHUB_STEP_SUMMARY
          safety check || echo "⚠️ 發現安全性問題" >> $GITHUB_STEP_SUMMARY
      
      - name: Run Bandit scan
        run: |
          echo "## 🔍 Bandit 程式碼掃描" >> $GITHUB_STEP_SUMMARY
          bandit -r app/ core/ -f json -o bandit-report.json || true
          bandit -r app/ core/ || echo "⚠️ 發現程式碼安全問題" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
