# Docker Compose 配置
# 支援開發和生產環境

services:
  # 開發環境
  web-dev:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=DEBUG
      - DEMO_MODE=true
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - dev

  # 生產環境
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

# 使用說明：
# 開發模式：docker-compose --profile dev up
# 生產模式：docker-compose --profile prod up -d
