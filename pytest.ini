[pytest]
# Pytest 配置檔案

# 測試目錄
testpaths = tests

# Python 檔案和測試函數的命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 輸出選項
# addopts = 
#     -v
#     --strict-markers
#     --tb=short
#     --cov=app
#     --cov=core
#     --cov-report=html
#     --cov-report=term-missing

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 執行較慢的測試
    api: API 端點測試

# 環境變數
env =
    FLASK_ENV=testing
